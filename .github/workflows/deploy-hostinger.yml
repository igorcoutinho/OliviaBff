name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: srv542.hstgr.io
      DEPLOY_USER: u384431467
      HOSTINGER_DOMAIN: api.minhasfotos.net
      HOSTINGER_USERNAME: u384431467
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_API_BASE: https://developers.hostinger.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload via FTP
        env:
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASS }}
        run: |
          mkdir -p tmp && touch tmp/restart.txt
          lftp -c "
            set net:timeout 30;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set ftp:ssl-allow true;
            set ssl:verify-certificate false;
            open -u '${DEPLOY_USER}','${FTP_PASS}' ftp://${DEPLOY_HOST};
            lcd .;
            cd domains/${HOSTINGER_DOMAIN}/public_html;
            mirror --reverse --delete --verbose \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob node_modules/ \
              --exclude-glob .env \
              --exclude-glob '.env.*' \
              --exclude-glob '*.zip' \
              --exclude-glob .DS_Store \
              --exclude-glob uploads/ \
              --exclude-glob data/ \
              . .;
          "

      - name: Reiniciar app via API
        run: |
          CODE=$(curl -sS -o /tmp/restart.json -w "%{http_code}" -X POST \
            "${HOSTINGER_API_BASE}/api/hosting/v1/accounts/${HOSTINGER_USERNAME}/websites/${HOSTINGER_DOMAIN}/nodejs/restart" \
            -H "Authorization: Bearer ${HOSTINGER_API_TOKEN}" \
            -H "Accept: application/json")
          echo "Restart HTTP ${CODE}"
          cat /tmp/restart.json || true

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 20 \
              "https://api.minhasfotos.net/api/health" || echo "000")
            echo "tentativa $i → HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 15
          done
          echo "Health check falhou"
          cat /tmp/health.json || true
          exit 1
